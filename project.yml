name: StrongVibes
options:
  bundleIdPrefix: net.shadyproject
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: X49T9R7SE6
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO
    # Bump these manually for a major or minor release.
    MAJOR_VERSION: "1"
    MINOR_VERSION: "0"

targets:
  StrongVibes:
    type: application
    platform: iOS
    info:
      path: Sources/StrongVibes/Resources/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: "StrongVibes reads workout history from Apple Health."
        NSHealthUpdateUsageDescription: "StrongVibes saves your strength training sessions to Apple Health."
        # Placeholders — overwritten at build time by the "Version from Git" script phase.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        GitCommitHash: "unknown"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - Sources/StrongVibes
    dependencies:
      - sdk: HealthKit.framework
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: X49T9R7SE6
        CODE_SIGN_IDENTITY: "Apple Development: Christopher Martin (X49T9R7SE6)"
        PROVISIONING_PROFILE_SPECIFIER: "profile name"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.shadyproject.strongvibes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/StrongVibes/Resources/StrongVibes.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "match Development net.shadyproject.strongvibes"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: "match Development net.shadyproject.strongvibes"

    postBuildScripts:
      - name: "Version from Git"
        # basedOnDependencyAnalysis: false forces this to run on every build,
        # not just when inputs change, so the commit count is always current.
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          COMMIT_COUNT=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "0")
          SHORT_HASH=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "0000000")
          VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${COMMIT_COUNT}"
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}"  "${PLIST}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${COMMIT_COUNT}"         "${PLIST}"
          /usr/libexec/PlistBuddy -c "Set :GitCommitHash ${SHORT_HASH}"             "${PLIST}"

          echo "StrongVibes ${VERSION} (${SHORT_HASH})"

  StrongVibesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/StrongVibesTests
    dependencies:
      - target: StrongVibes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadyproject.strongvibes.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  StrongVibes:
    build:
      targets:
        StrongVibes: all
    run:
      config: Debug
    test:
      targets:
        - StrongVibesTests
    analyze:
      config: Debug
    archive:
      config: Release
